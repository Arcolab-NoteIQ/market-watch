name: Email digest

on:
  schedule:
    # 03:00 UTC = 08:30 IST, Monday and Thursday (after the 06:37 IST data refresh)
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      record:
        description: "Mark these items as sent (leave off for a test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and send the digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://arcolab-noteiq.github.io/market-watch/' }}
          UPDATE_STATE: ${{ github.event_name == 'schedule' || inputs.record }}
        run: python scripts/email_digest.py

      - name: Save what was sent
        if: github.event_name == 'schedule' || inputs.record
        run: |
          git config user.name "Market Watch digest"
          git config user.email "noreply@github.com"
          git add email/state.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m "Digest sent $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
